<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Source+Sans+3:wght@600&family=JetBrains+Mono:wght@400&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0F0E0C radial-gradient(ellipse at 50% 0%,#1C1915 0%,#0F0E0C 55%,#080807 100%);color:#E9E2D3;font-family:'Source Sans 3',sans-serif;display:flex;align-items:center;justify-content:center}
.card{text-align:center;width:1000px}
.eyebrow{font-size:20px;font-weight:600;letter-spacing:0.28em;text-transform:uppercase;color:#8C8477;margin-bottom:26px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:96px;line-height:1;margin:0 0 22px;color:#E9E2D3;letter-spacing:0.01em}
h1 span{color:#D9A441;font-size:0.42em;vertical-align:middle;margin:0 0.5em}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:38px;color:#B5AC9C;margin:0 0 34px}
.row{display:flex;justify-content:center;gap:14px}
.chip{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:0.08em;text-transform:uppercase;color:#D9A441;border:1px solid #4A433B;padding:10px 18px;border-radius:2px}
.seal{width:118px;height:118px;margin:0 auto 22px}
</style></head><body><div class="card">
<svg class="seal" viewBox="0 0 120 120" fill="none" stroke="#D9A441"><circle cx="60" cy="60" r="56" stroke-width="1.4"/><circle cx="60" cy="60" r="44" stroke-width="0.7" stroke-dasharray="3 4"/><circle cx="60" cy="60" r="30" stroke-width="0.7"/><g stroke-width="1"><line x1="60" y1="4" x2="60" y2="12"/><line x1="60" y1="108" x2="60" y2="116"/><line x1="4" y1="60" x2="12" y2="60"/><line x1="108" y1="60" x2="116" y2="60"/><line x1="20.4" y1="20.4" x2="26" y2="26"/><line x1="94" y1="94" x2="99.6" y2="99.6"/><line x1="99.6" y1="20.4" x2="94" y2="26"/><line x1="26" y1="94" x2="20.4" y2="99.6"/></g><text x="60" y="71" font-family="Cormorant Garamond" font-weight="600" font-size="34" text-anchor="middle" fill="#D9A441" stroke="none">&#10022;</text></svg>
<div class="eyebrow">One life at random from everyone who was ever born</div>
<h1>Everyone Who Ever Lived</h1>
<p class="sub">105 billion births. One at a time.</p>
<div class="row"><span class="chip">Any human, ever</span><span class="chip">The last 100 years</span><span class="chip">Before 1926</span></div>
</div></body></html>
